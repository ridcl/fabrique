[project]
name = "fabrique"
version = "0.5.0"
description = "Foundation for modern ML research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-tunix[prod]==0.1.6",
    "flax==0.12.6",
    # flax 0.12.6 uses jax.core.Effect, removed in jax 0.11 -- but flax only
    # declares `jax>=0.8.1`, so an unpinned `uv lock` happily resolves 0.11.x
    # and produces an environment where nothing imports.  Pin it here; the
    # Dockerfile re-locks on every build, so the lockfile alone is not enough.
    "jax<0.11",
    "optax>=0.2.5",
    "multimethod>=2.0",
]

[dependency-groups]
dev = [
    "ipython>=9.2.0",
    "pytest>=8.4.1",
    "ruff>=0.13.1",
    "ty>=0.0.76",
]
extra = [
    "pillow>=11.2.1",
    "datasets>=4.1.1",
]
# Cross-framework consistency checks (JAX vs HuggingFace) only.  Deliberately
# NOT in default-groups: torch's CUDA build ships nvidia-*-cu13 wheels that
# install over JAX's nvidia-*-cu12 ones -- notably libcudnn.so.9 -- which
# silently disables the cuDNN flash-attention kernel.  Pinned to the CPU build
# (see [tool.uv.sources]), which has no nvidia dependencies at all; the
# consistency checks run on CPU anyway.  Installed only in the
# `build-dev-torch` Docker stage.
crosscheck = [
    "torch",
    "torchvision",
    "accelerate",
]


[tool.uv]
default-groups = ["dev", "extra"]

# `explicit = true` keeps this index out of normal resolution: it is consulted
# only for the packages routed to it in [tool.uv.sources] below.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }


# `tests` is the pytest suite and nothing else: pure-JAX, runs in the default
# environment, safe for CI.  One-off cross-framework checks live in `crosscheck/`
# and must never be collected -- they need torch, which CI does not install.
# `reference/` is a vendored read-only checkout (gitignored) with its own,
# unrunnable test tree.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference", "build", "dist", "output", "crosscheck", ".git"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["reference", "build", "dist", "output"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default arg: common and intentional in JAX configs
]

[tool.ruff.lint.per-file-ignores]
# Experiments, tests and cross-framework checks set sys.path / env before
# importing, so imports cannot all sit at the top of the file.  Note ruff still
# lints crosscheck/ -- it never resolves imports, so absent torch is a non-issue.
"experiments/*" = ["E402"]
"tests/*" = ["E402"]
"crosscheck/*" = ["E402"]

[tool.ty.environment]
python = "/venv"

# `crosscheck` is excluded because those scripts import torch/torchvision, which
# are NOT installed in the default environment (see the `crosscheck` dependency
# group above) -- without this, every default-env run reports unresolved imports.
[tool.ty.src]
exclude = ["reference", "build", "dist", "output", "crosscheck"]
